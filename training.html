<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棒球訓練 - 揮棒反應訓練</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="training.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="nav-bar">
                <a href="index.html" class="nav-link">動作分析</a>
                <a href="training.html" class="nav-link active">揮棒訓練</a>
            </nav>
            <h1>揮棒反應訓練</h1>
            <p class="subtitle">訓練你的揮棒決策能力 - 聽到 GO 就揮棒，聽到 STOP 就收棒</p>
        </header>

        <main>
            <section class="step" id="settingsSection">
                <div class="step-header">
                    <span class="step-number">1</span>
                    <h2>訓練設定</h2>
                </div>
                
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="roundCount">訓練回合數</label>
                        <select id="roundCount">
                            <option value="5">5 回合</option>
                            <option value="10" selected>10 回合</option>
                            <option value="15">15 回合</option>
                            <option value="20">20 回合</option>
                            <option value="0">練到吐</option>
                        </select>
                    </div>
                    
                    <div class="setting-item">
                        <label for="intervalTime">間隔時間（秒）</label>
                        <select id="intervalTime">
                            <option value="2">2 秒</option>
                            <option value="3" selected>3 秒</option>
                            <option value="4">4 秒</option>
                            <option value="5">5 秒</option>
                        </select>
                    </div>
                    
                    <div class="setting-item">
                        <label for="goRatio">GO 出現機率</label>
                        <select id="goRatio">
                            <option value="30">30%</option>
                            <option value="50" selected>50%</option>
                            <option value="70">70%</option>
                        </select>
                    </div>

                    <div class="setting-item">
                        <label for="rhythmSpeed">節奏速度</label>
                        <select id="rhythmSpeed">
                            <option value="1000">慢速 (1秒)</option>
                            <option value="700" selected>正常 (0.7秒)</option>
                            <option value="500">快速 (0.5秒)</option>
                            <option value="300">極快 (0.3秒)</option>
                        </select>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary btn-large" id="startTrainingBtn">
                        開始訓練
                    </button>
                </div>
            </section>

            <section class="step" id="trainingSection" style="display: none;">
                <div class="training-display">
                    <div class="round-info">
                        <span id="currentRound">0</span> / <span id="totalRounds">10</span>
                    </div>
                    
                    <div class="command-display" id="commandDisplay">
                        準備開始...
                    </div>
                    
                    <div class="visual-indicator" id="visualIndicator">
                        <div class="indicator-circle"></div>
                    </div>

                    <div class="countdown-display" id="countdownDisplay">
                        
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-secondary" id="pauseBtn">暫停</button>
                    <button class="btn btn-danger" id="stopTrainingBtn">結束訓練</button>
                </div>
            </section>

            <section class="step" id="resultSection" style="display: none;">
                <div class="step-header">
                    <span class="step-number">2</span>
                    <h2>訓練完成</h2>
                </div>
                
                <div class="result-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalRoundsResult">0</div>
                        <div class="stat-label">總回合數</div>
                    </div>
                    <div class="stat-card go">
                        <div class="stat-value" id="goCount">0</div>
                        <div class="stat-label">GO 次數</div>
                    </div>
                    <div class="stat-card stop">
                        <div class="stat-value" id="stopCount">0</div>
                        <div class="stat-label">STOP 次數</div>
                    </div>
                </div>

                <div class="user-input-section">
                    <h4>記錄你的表現</h4>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="successInput">成功次數</label>
                            <input type="number" id="successInput" min="0" value="0">
                        </div>
                        <div class="input-group">
                            <label for="failInput">失敗次數</label>
                            <input type="number" id="failInput" min="0" value="0">
                        </div>
                    </div>
                    <button class="btn btn-success" id="saveResultBtn">儲存結果</button>
                </div>

                <div class="history-section">
                    <h4>歷史成功率</h4>
                    <div class="history-summary">
                        <div class="history-stat">
                            <span class="history-label">總訓練次數</span>
                            <span class="history-value" id="historyTotal">0</span>
                        </div>
                        <div class="history-stat">
                            <span class="history-label">總成功次數</span>
                            <span class="history-value" id="historySuccess">0</span>
                        </div>
                        <div class="history-stat">
                            <span class="history-label">歷史成功率</span>
                            <span class="history-value" id="historyRate">--%</span>
                        </div>
                    </div>
                    <button class="btn btn-small btn-outline" id="clearHistoryBtn">清除歷史</button>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" id="restartBtn">再次訓練</button>
                    <button class="btn btn-secondary" id="backToSettingsBtn">調整設定</button>
                </div>
            </section>
        </main>
    </div>

    <script src="training.js"></script>
</body>
</html>
